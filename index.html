<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!-- Esta etiqueta es OBLIGATORIA para que el diseño sea responsive en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Comisiones</title>
    <link rel="stylesheet" href="ventas.css">
    <script src="utilitarios.js"></script>
    <script src="ventas.js"></script>
</head>

<body>

    <div class="contenedor">
        <h1>Calculadora de Comisiones</h1>

        <label for="txtSueldoBase">Salario Base:</label>
        <input type="text" id="txtSueldoBase" placeholder="Ej. 50.00">
        <span id="error-txtSueldoBase" class="mensaje-error"></span>

        <label for="txtVentas">Número de ventas:</label>
        <input type="text" id="txtVentas" placeholder="Ej. 12">
        <span id="error-txtVentas" class="mensaje-error"></span>

        <label for="txtPrecio">Precio del producto:</label>
        <input type="text" id="txtPrecio" placeholder="Ej. 10.00">
        <span id="error-txtPrecio" class="mensaje-error"></span>

        <button onclick="calcular()">Calcular Comisión</button>

        <h2>Resultados</h2>
        <p>Salario Base: <span id="spSueldoBase"></span></p>
        <p>Comisión: <span id="spComision"></span></p>
        <p class="total-destacado">Total: <span id="spTotal"></span></p>
    </div>

</body>

</html>
